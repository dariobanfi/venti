name: Android

# Builds the Rust core for Android and for the build machine, runs the unit
# tests against the real core, builds the app, and runs its UI tests on an
# emulator. The UI tests take a screenshot of every screen; they are
# published as the `android-screenshots` artifact, and the app itself as
# `venti-debug-apk`. For the wind map the tests talk to a Venti server
# started here in its development mode, which answers from recorded data.

on:
  push:
    paths:
      - "apps/android/**"
      # The sample flight, the label fonts and the demo map region, which
      # the Android app takes from where the iOS app keeps them.
      - "apps/ios/Venti/Resources/**"
      - "map/**"
      # The core and everything it is built from, and the server the wind
      # map's tests ask.
      - "crates/**"
      - "tools/uniffi-bindgen-swift/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A run in progress is allowed to finish, because several
# sessions push to main and a build that is always cancelled tells nobody
# anything; of the runs waiting behind it only the newest is kept.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Core bridge, app and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Rust toolchain with the Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: cargo-ndk, which links the core with the Android NDK
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v5

      - name: Tool versions
        working-directory: apps/android
        run: |
          java -version
          cargo ndk --version
          ./gradlew --version

      # The unit tests call the real core through the generated Kotlin
      # interface, with a build of the core for this machine.
      - name: Unit tests, lint and the app
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      # A debug build, signed with the throwaway key every Android build
      # machine makes for itself. It installs on any phone that allows apps
      # from outside a store; it is not a release.
      - uses: actions/upload-artifact@v4
        with:
          name: venti-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start a Venti server on recorded data
        run: |
          cargo build -p venti-server
          nohup target/debug/venti-server dev > target/venti-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/v1/health

      # Plain Android 16 without Google's services: the app must not need
      # them. An emulator reaches the machine it runs on at 10.0.2.2, which
      # is where the wind map's test finds the server.
      #
      # The renderer is chosen for the map. The emulator's usual software
      # renderer (swiftshader_indirect) draws none of the map's symbols:
      # no place names, no wind arrows, no dashed lines. This one draws
      # them as a phone does.
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot-save
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.ventiServer=http://10.0.2.2:8080

      - name: Collect the screenshots the UI tests took
        if: always()
        run: |
          mkdir -p apps/android/build/screenshots
          find apps/android/app/build/outputs -name '*.png' -path '*additional_output*' \
            -exec cp {} apps/android/build/screenshots/ \;
          ls -l apps/android/build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: apps/android/build/screenshots
          if-no-files-found: warn

      # The device's log of every test is in here, which is where the map
      # engine says what it could not load.
      - name: Keep the test reports and the device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

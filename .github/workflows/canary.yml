name: Source canary

# Runs every data source against its live provider once a day. Providers
# change formats without notice; a failure here is how the project finds out.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Live run of every region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p venti-ingest
      - name: Run each region pack
        run: |
          status=0
          for region in regions/*/region.toml; do
            echo "::group::$region"
            ./target/release/venti-ingest "$region" || status=1
            echo "::endgroup::"
          done
          exit $status

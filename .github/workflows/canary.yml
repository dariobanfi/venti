name: Source canary

# Runs every data source against its live provider once a day: the sources of
# observations and the sources of airspace of every region pack. Providers
# change formats without notice; a failure here is how the project finds out.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Live run of every region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The canary runs from the image a server runs. So it also notices
      # when the image itself can no longer reach a provider, for example
      # because its list of trusted certificates has gone stale.
      - name: Build the server image
        run: docker build --file deploy/Dockerfile --tag venti-server:canary .
      - name: Run each region pack
        run: |
          status=0
          for region in regions/*/region.toml; do
            echo "::group::$region"
            docker run --rm venti-server:canary ingest "/app/$region" || status=1
            echo "::endgroup::"
          done
          exit $status

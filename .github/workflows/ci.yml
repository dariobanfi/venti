name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    # The store's behavioural suite runs against a real PostgreSQL with
    # PostGIS. The password is not a secret: the database lives for one job.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: venti
          POSTGRES_PASSWORD: venti
          POSTGRES_DB: venti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username venti --dbname venti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VENTI_TEST_DATABASE_URL: postgres://venti:venti@127.0.0.1:5432/venti
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Builds the server image the way a server would and starts it in its
  # development mode. Nothing is published: where images go is the owner's
  # decision.
  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image is built with the pinned compiler
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          grep --quiet "^FROM rust:${toolchain}-" deploy/Dockerfile \
            || { echo "deploy/Dockerfile does not build with Rust ${toolchain}"; exit 1; }
      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag venti-server:ci .
      - name: Start it on recorded data and ask every endpoint
        run: |
          # Confined as docker-compose.yml confines it: no capabilities, no
          # new privileges, a read-only root, bounds on memory and
          # processes. The steps below include an upload, which the server
          # analyses in a child process.
          docker run --detach --name venti --publish 127.0.0.1:8080:8080 \
            --cap-drop ALL --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp:size=16m --memory 1g --pids-limit 1024 \
            venti-server:ci dev --listen 0.0.0.0:8080 --open-to-the-network
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://127.0.0.1:8080/v1/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/v1/health
          curl --silent --fail 'http://127.0.0.1:8080/v1/stations?bbox=9.4,46.3,17.2,48.5' | jq --exit-status '.stations | length == 6'
          curl --silent --fail http://127.0.0.1:8080/v1/stations/dwd-10min:05792/observations | jq --exit-status '.observations | length > 100'
          curl --silent --fail 'http://127.0.0.1:8080/v1/airspace?bbox=9.4,46.3,17.2,48.5' \
            | jq --exit-status '.layers | length == 1 and .[0].source == "openaip" and (.[0].airspaces | length) == 192 and (.[0].countries | length) == 8 and (.[0].covers | length) == 1'
      - name: Ask the connector for its tools and for the wind at the Zugspitze
        run: |
          # The oldest revision of the protocol: a conversation begins with
          # initialize, and no request names a revision.
          ask() {
            curl --silent --fail --request POST http://127.0.0.1:8080/mcp \
              --header 'Content-Type: application/json' "$@"
          }
          ask --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | jq --exit-status '.result.serverInfo.name == "venti" and .result.protocolVersion == "2025-03-26"'
          ask --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | jq --exit-status '[.result.tools[].name] == ["wind_stations", "station_history", "airspace_at"]'
          # The newest: every request stands alone and says so in its headers.
          ask --header 'MCP-Protocol-Version: 2026-07-28' --header 'Mcp-Method: tools/call' --header 'Mcp-Name: wind_stations' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"wind_stations","arguments":{"latitude":47.42,"longitude":10.98},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | jq --exit-status '.result.resultType == "complete" and .result.isError == false and (.result.content[0].text | fromjson | .stations[0].name) == "Zugspitze"'
          # A page of another site may not call from a browser.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/mcp \
            --header 'Content-Type: application/json' --header 'Origin: https://evil.example' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/list"}')" = 403
      - name: Ask for the demo account's flights, upload one and fetch its share page
        run: |
          token=venti_0000000000000000000000000000000000000000000000000000
          curl --silent --fail --header "Authorization: Bearer $token" \
            http://127.0.0.1:8080/v1/flights | jq --exit-status '.flights | length == 3'
          # An upload is analysed by a child process of the server, as the
          # user the image runs as. The bundled sample is one of the demo
          # flights, so the answer is that it is already there.
          curl --silent --fail --header "Authorization: Bearer $token" \
            --data-binary @apps/ios/Venti/Resources/sample.igc \
            http://127.0.0.1:8080/v1/flights \
            | jq --exit-status '.created == false and .flight.identity == "6c55247b80a34b03fa0bb3bd38173c59"'
          shared=$(curl --silent --fail http://127.0.0.1:8080/v1/pilots/demo | jq --raw-output '.flights[0].id')
          curl --silent --fail "http://127.0.0.1:8080/f/$shared" | grep --quiet 'property="og:image"'
          curl --silent --fail --output preview.png "http://127.0.0.1:8080/f/$shared/preview.png"
          file preview.png | grep 'PNG image data, 1200 x 630'
      - name: Show the server's log
        if: always()
        run: docker logs venti
      - name: Check the Compose file and the Caddyfile
        run: |
          cp deploy/env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' deploy/.env
          docker compose --file deploy/docker-compose.yml config --quiet
          # Ports are published on IPv4 only, so that no visitor arrives
          # through Docker's forwarder with their address hidden.
          docker compose --file deploy/docker-compose.yml config --format json \
            | jq --exit-status '[.services[].ports // [] | .[] | .host_ip == "0.0.0.0"] | length == 3 and all'
          # The three services are confined: no capability but those named,
          # no new privileges, a read-only root, bounds on memory and
          # processes.
          docker compose --file deploy/docker-compose.yml config --format json \
            | jq --exit-status '[.services[] | (.cap_drop == ["ALL"]) and (.security_opt | index("no-new-privileges:true") != null) and .read_only and (.mem_limit != null) and (.pids_limit > 0)] | length == 3 and all'
          docker compose --file deploy/docker-compose.yml config --format json \
            | jq --exit-status '.services | (.server.cap_add // []) == [] and .caddy.cap_add == ["NET_BIND_SERVICE"] and (.db.environment.POSTGRES_USER == "postgres")'
          # Every service's log is rotated: none can fill the disk.
          docker compose --file deploy/docker-compose.yml config --format json \
            | jq --exit-status '[.services[] | .logging | .driver == "json-file" and (.options["max-size"] | type == "string") and (.options["max-file"] | type == "string")] | length == 3 and all'
          docker run --rm --env VENTI_SITE_ADDRESS=:80 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Caddy sends the web app's pages, each with its policy
        run: |
          # A site of the shape the web app is built in: every page a
          # folder, the core's worker under workers/, the map engine's
          # under assets/.
          mkdir -p web/logbook web/_app/immutable/workers web/_app/immutable/assets
          echo '<!doctype html><title>Map</title>' > web/index.html
          echo '<!doctype html><title>Logbook</title>' > web/logbook/index.html
          echo 'onmessage = () => {}' > web/_app/immutable/workers/worker-1.js
          echo 'onmessage = () => {}' > web/_app/immutable/assets/maplibre-gl-worker.1.mjs
          echo 'body {}' > web/_app/immutable/assets/0.css
          docker run --detach --name caddy-check --env VENTI_SITE_ADDRESS=:80 \
            --publish 127.0.0.1:8081:80 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$PWD/web:/srv/web:ro" \
            caddy:2.10-alpine
          for attempt in $(seq 1 20); do
            curl --silent --fail --output /dev/null http://127.0.0.1:8081/ && break
            sleep 1
          done
          site=http://127.0.0.1:8081

          # An address gets its own page, with or without the last slash,
          # and one that is no page gets the entry page.
          curl --silent --fail "$site/" | grep --fixed-strings '<title>Map</title>'
          curl --silent --fail "$site/logbook/" | grep --fixed-strings '<title>Logbook</title>'
          curl --silent --fail "$site/logbook" | grep --fixed-strings '<title>Logbook</title>'
          curl --silent --fail "$site/nowhere/" | grep --fixed-strings '<title>Map</title>'

          # No page may be framed, and neither may a stylesheet's address
          # or one that is no file.
          for path in / /logbook/ /nowhere/ /_app/immutable/assets/0.css; do
            curl --silent --fail --head "$site$path" > headers.txt
            grep --ignore-case --fixed-strings --line-regexp \
              "content-security-policy: frame-ancestors 'none'; base-uri 'none'" <(tr -d '\r' < headers.txt)
            grep --ignore-case --fixed-strings "x-frame-options: DENY" headers.txt
            grep --ignore-case --fixed-strings "x-content-type-options: nosniff" headers.txt
          done

          # A script arrives with the list a worker is held to, wherever
          # the build put it, and so does an address that only ends like
          # one: it gets the entry page, which may not be framed either.
          for path in /_app/immutable/workers/worker-1.js /_app/immutable/assets/maplibre-gl-worker.1.mjs /nowhere.js; do
            curl --silent --fail --head "$site$path" | tr -d '\r' > headers.txt
            grep --ignore-case "^content-security-policy: default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://" headers.txt
            grep --ignore-case "^content-security-policy: .*; frame-ancestors 'none'; base-uri 'none'$" headers.txt
            test "$(grep --ignore-case --count '^content-security-policy:' headers.txt)" = 1
            grep --ignore-case --fixed-strings "x-frame-options: DENY" headers.txt
          done
          docker rm --force caddy-check

          # The workers may talk to the hosts the map's tiles come from and
          # to no others: the web app names them in one file, the Caddyfile
          # in one line.
          grep --extended-regexp "^\s*(basemap|terrainTiles): '" apps/web/src/lib/map/online.ts \
            | grep --only-matching --extended-regexp "https://[^/']+" | sort --unique > hosts-app.txt
          grep --fixed-strings 'header @scripts Content-Security-Policy' deploy/Caddyfile \
            | grep --only-matching --extended-regexp "https://[^ ;\"]+" | sort --unique > hosts-caddy.txt
          test -s hosts-app.txt
          diff hosts-app.txt hosts-caddy.txt

  dependencies:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

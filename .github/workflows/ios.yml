name: iOS

# Builds the Rust core for Apple platforms, runs the bridge tests on the Mac,
# then builds the app and runs its unit tests and UI tests on an iPhone
# simulator. The UI tests take a screenshot of every screen; they are
# published as the `ios-screenshots` artifact. For the wind map the tests
# talk to a Venti server started here in its development mode, which
# answers from recorded data.

on:
  push:
    paths:
      - "apps/ios/**"
      - "map/**"
      - "crates/core/**"
      - "crates/flight/**"
      - "crates/domain/**"
      - "crates/sensors/**"
      - "crates/airspace/**"
      - "crates/api-types/**"
      - "crates/llm/**"
      - "crates/tools/**"
      - "tools/uniffi-bindgen-swift/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A run in progress is allowed to finish, because several
# sessions push to main and a build that is always cancelled tells nobody
# anything; of the runs waiting behind it only the newest is kept.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Core bridge and app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build the Rust core for Apple platforms
        run: apps/ios/scripts/build-core.sh

      - name: Bridge tests on the Mac
        run: swift test --package-path apps/ios/Packages/VentiCore

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate

      - name: Pick the newest iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, device["udid"], device["name"])
          if best is None:
              sys.exit("no iPhone simulator is installed")
          print("using", best[2], "with iOS", ".".join(map(str, best[0])), file=sys.stderr)
          print(best[1])
          ')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Start a Venti server on recorded data
        run: |
          cargo build -p venti-server
          nohup target/debug/venti-server dev > target/venti-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/v1/health

      - name: Build and test the app on the simulator
        env:
          # Reaches the UI tests as VENTI_SERVER. The simulator shares the
          # Mac's network, so the app finds the server at this address.
          TEST_RUNNER_VENTI_SERVER: http://127.0.0.1:8080
        run: |
          set -o pipefail
          # The build cache restores `target`, and with it what an earlier
          # run left there. xcodebuild refuses to overwrite a result bundle.
          #
          # The app is signed for this Mac only ("-"), which needs no
          # certificate. Left unsigned, it has no identity, and the
          # simulator's Keychain then refuses to keep the session token and
          # the assistant's key: the tests would not see what a phone does.
          rm -rf target/apple/Venti.xcresult target/apple/attachments target/apple/screenshots
          xcodebuild test \
            -project apps/ios/Venti.xcodeproj \
            -scheme Venti \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath target/apple/DerivedData \
            -resultBundlePath target/apple/Venti.xcresult \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee target/apple/xcodebuild.log \
            | grep -E "^Test (Suite|Case) |Executed [0-9]+ tests|(error|warning): |\*\* TEST"

      - name: Keep the full build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: target/apple/xcodebuild.log

      - name: Collect the screenshots the UI tests took
        if: always()
        run: |
          [ -d target/apple/Venti.xcresult ] || exit 0
          xcrun xcresulttool export attachments \
            --path target/apple/Venti.xcresult \
            --output-path target/apple/attachments
          python3 - <<'EOF'
          import json, pathlib, re, shutil

          source = pathlib.Path("target/apple/attachments")
          target = pathlib.Path("target/apple/screenshots")
          target.mkdir(exist_ok=True)
          for test in json.loads((source / "manifest.json").read_text()):
              for attachment in test.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  name = attachment.get("suggestedHumanReadableName") or exported
                  # "light-1-map_0_<UUID>.png" becomes "light-1-map.png".
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(\.\w+)$", r"\1", name)
                  if name.endswith(".png"):
                      shutil.copy(source / exported, target / name)
          # What XCTest kept by itself of a test that failed: a recording of
          # the screen, and what it could read of the screen at that moment.
          failures = target / "failures"
          for test in json.loads((source / "manifest.json").read_text()):
              for attachment in test.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  if exported.lower().endswith((".mp4", ".mov", ".txt")):
                      failures.mkdir(exist_ok=True)
                      identifier = re.sub(r"[^A-Za-z0-9]+", "-", test.get("testIdentifier", "test")).strip("-")
                      shutil.copy(source / exported, failures / f"{identifier}-{exported}")
          EOF
          # Half size is enough to judge a screen and keeps the artifact small.
          sips -Z 1400 target/apple/screenshots/*.png > /dev/null
          ls -lR target/apple/screenshots

      # A UI test that fails on a slow machine and passes on a fast one can
      # only be understood from when each of its steps began.
      - name: Keep when each step of a failed UI test began
        if: failure()
        continue-on-error: true
        run: |
          [ -d target/apple/Venti.xcresult ] || exit 0
          mkdir -p target/apple/screenshots/failures
          xcrun xcresulttool get test-results tests \
            --path target/apple/Venti.xcresult > target/apple/tests.json
          python3 - <<'EOF'
          import json, pathlib, re, subprocess

          def failed(node):
              if node.get("nodeType") == "Test Case" and node.get("result") == "Failed":
                  yield node.get("nodeIdentifier")
              for child in node.get("children", []):
                  yield from failed(child)

          tree = json.loads(pathlib.Path("target/apple/tests.json").read_text())
          for root in tree.get("testNodes", []):
              for identifier in failed(root):
                  if not identifier:
                      continue
                  steps = subprocess.run(
                      ["xcrun", "xcresulttool", "get", "test-results", "activities",
                       "--test-id", identifier, "--path", "target/apple/Venti.xcresult"],
                      capture_output=True, text=True,
                  )
                  name = re.sub(r"[^A-Za-z0-9]+", "-", identifier).strip("-")
                  pathlib.Path(f"target/apple/screenshots/failures/{name}-steps.json").write_text(
                      steps.stdout or steps.stderr
                  )
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: target/apple/screenshots
          if-no-files-found: warn

  # An app for a real iPhone, built without a signature. Nobody's certificate
  # is in this repository: whoever installs the app signs this file with
  # their own certificate and provisioning profile.
  device:
    name: Unsigned build for an iPhone
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build the Rust core for Apple platforms
        run: apps/ios/scripts/build-core.sh

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate

      - name: Build the app for an iPhone, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/ios/Venti.xcodeproj \
            -scheme Venti \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath target/apple/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee target/apple/xcodebuild-device.log \
            | grep -E "(error|warning): |\*\* BUILD"

      - name: Keep the full build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-device-log
          path: target/apple/xcodebuild-device.log

      - name: Package the app as an .ipa file
        run: |
          mkdir -p target/apple/ipa/Payload
          cp -R target/apple/DerivedData/Build/Products/Release-iphoneos/Venti.app target/apple/ipa/Payload/
          cd target/apple/ipa
          zip -qry ../Venti-unsigned.ipa Payload
          ls -lh ../Venti-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: venti-unsigned-ipa
          path: target/apple/Venti-unsigned.ipa
          if-no-files-found: error

name: Web

# Builds the Rust core as WebAssembly and the web app as static files, runs
# the unit tests, then uses the built site in a real browser, with the Venti
# server in its development mode behind it for the wind. Those tests take a
# screenshot of every screen at a phone's width and at a desktop's, in light
# and in dark appearance; they are published as the `web-screenshots`
# artifact, and the site itself as `web-site`.
#
# Nothing is deployed from here. Publishing the site is the owner's decision.

on:
  push:
    paths:
      - "apps/web/**"
      - "map/**"
      # The core for the browser, and the server the browser tests ask for
      # the wind: between them they build on most of the workspace.
      - "crates/**"
      # The sample flight, the label fonts and the map region the tests draw
      # are shared with the iOS app and live in its folder.
      - "apps/ios/Venti/Resources/sample.igc"
      - "apps/ios/Venti/Resources/MapDemo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and every push gets its own finished run.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Core for the browser, site and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      # Also keeps the wasm-bindgen tool that the next step installs.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the web app's dependencies
        run: npm ci

      - name: Build the Rust core for the browser
        run: scripts/build-core.sh

      - name: Licences of the npm packages
        run: npm run licences

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build

      # The browser tests start it in its development mode, which answers
      # from recorded data. Built here so that its compiler output has a
      # step of its own.
      - name: Build the Venti server for the wind
        run: cargo build --locked -p venti-server

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      # The app uses the system's typeface, and this machine's is wider than
      # any phone's or desktop's. See e2e/fonts.conf.
      - name: Give the screenshots a typeface like a phone's
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-inter
          mkdir -p ~/.config/fontconfig
          cp e2e/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-match system-ui | grep Inter

      - name: Use the site as a pilot would, and keep a screenshot of every screen
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: apps/web/screenshots
          if-no-files-found: warn

      - name: Keep what the browser tests left behind when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: apps/web/build
          if-no-files-found: error

[workspace]
resolver = "3"
members = ["crates/*", "tools/uniffi-bindgen-swift"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dariobanfi/venti"
publish = false

[workspace.dependencies]
venti-domain = { path = "crates/domain" }
venti-airspace = { path = "crates/airspace" }
venti-api-types = { path = "crates/api-types" }
venti-store = { path = "crates/store" }
venti-sources = { path = "crates/sources" }
venti-sources-dwd = { path = "crates/sources-dwd" }
venti-sources-geosphere = { path = "crates/sources-geosphere" }
venti-sources-openaip = { path = "crates/sources-openaip" }
venti-sources-osm = { path = "crates/sources-osm" }
venti-sources-basemapat = { path = "crates/sources-basemapat" }
venti-sources-openmeteo = { path = "crates/sources-openmeteo" }
venti-regions = { path = "crates/regions" }
venti-flight = { path = "crates/flight" }
venti-sensors = { path = "crates/sensors" }
venti-leagues = { path = "crates/leagues" }
venti-llm = { path = "crates/llm" }
venti-mcp = { path = "crates/mcp" }
venti-tools = { path = "crates/tools" }
venti-core = { path = "crates/core" }

argon2 = "0.6.0"
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
deadpool-postgres = "0.14.2"
fastrand = "2.5.0"
flate2 = "1.1.10"
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
getrandom = "0.4.3"
image-webp = "0.2.4"
ipnet = "2.12.2"
js-sys = "=0.3.106"
png = "0.18.1"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tokio-util = "0.7.20"
toml = "1.2.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "smallvec", "std"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
unicode-normalization = "0.1.26"
uniffi = "0.32.2"
# Held at 0.2.129, and js-sys with it: the tool that binds the core for the
# browser, wasm-bindgen-cli, must be of exactly this version, and the
# registry mirror the owner's Mac builds from has no newer one yet. Move
# both on together once it has.
wasm-bindgen = "=0.2.129"
zune-core = "0.5.3"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The WebAssembly build of the core for the web app: small before fast,
# because every visitor downloads it. apps/web/scripts/build-core.sh uses it.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

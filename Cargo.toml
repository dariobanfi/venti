[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dariobanfi/venti"
publish = false

[workspace.dependencies]
venti-domain = { path = "crates/domain" }
venti-sources = { path = "crates/sources" }
venti-sources-dwd = { path = "crates/sources-dwd" }
venti-sources-geosphere = { path = "crates/sources-geosphere" }
venti-regions = { path = "crates/regions" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

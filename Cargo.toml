[workspace]
resolver = "3"
members = ["crates/*", "tools/uniffi-bindgen-swift"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dariobanfi/venti"
publish = false

[workspace.dependencies]
venti-domain = { path = "crates/domain" }
venti-airspace = { path = "crates/airspace" }
venti-api-types = { path = "crates/api-types" }
venti-store = { path = "crates/store" }
venti-sources = { path = "crates/sources" }
venti-hdf5 = { path = "crates/hdf5" }
venti-sources-dwd = { path = "crates/sources-dwd" }
venti-sources-dwd-radar = { path = "crates/sources-dwd-radar" }
venti-sources-geosphere = { path = "crates/sources-geosphere" }
venti-sources-geosphere-radar = { path = "crates/sources-geosphere-radar" }
venti-sources-openaip = { path = "crates/sources-openaip" }
venti-sources-ogn = { path = "crates/sources-ogn" }
venti-sources-ffvl = { path = "crates/sources-ffvl" }
venti-sources-osm = { path = "crates/sources-osm" }
venti-outline = { path = "crates/outline" }
venti-sources-basemapat = { path = "crates/sources-basemapat" }
venti-sources-ign = { path = "crates/sources-ign" }
venti-sources-eawsregions = { path = "crates/sources-eawsregions" }
venti-sources-naturalearth = { path = "crates/sources-naturalearth" }
venti-sources-timezones = { path = "crates/sources-timezones" }
venti-sources-openmeteo = { path = "crates/sources-openmeteo" }
venti-sources-suedtirol = { path = "crates/sources-suedtirol" }
venti-sources-awc = { path = "crates/sources-awc" }
venti-sources-meteoswiss = { path = "crates/sources-meteoswiss" }
venti-sources-pioupiou = { path = "crates/sources-pioupiou" }
venti-sources-slf = { path = "crates/sources-slf" }
venti-sources-arso = { path = "crates/sources-arso" }
venti-sources-meteotrentino = { path = "crates/sources-meteotrentino" }
venti-sources-arpalombardia = { path = "crates/sources-arpalombardia" }
venti-regions = { path = "crates/regions" }
venti-flight = { path = "crates/flight" }
venti-sensors = { path = "crates/sensors" }
venti-leagues = { path = "crates/leagues" }
venti-llm = { path = "crates/llm" }
venti-mcp = { path = "crates/mcp" }
venti-tools = { path = "crates/tools" }
venti-core = { path = "crates/core" }

# Web Push (RFC 8291, RFC 8292): the key exchange and signatures on P-256,
# HKDF and AES-128-GCM, all RustCrypto, of sha2's generation.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = "0.6.0"
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# The rules of the world's time zones, for a flight's calendar by the clock
# where it was flown (crates/core/src/time_zones.rs).
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
deadpool-postgres = "0.14.2"
fastrand = "2.5.0"
flate2 = "1.1.10"
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
image-webp = "0.2.4"
ipnet = "2.12.2"
# pem: reading the APNs key (.p8, PKCS #8) for push to iPhones.
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pem", "std"] }
js-sys = "=0.3.106"
png = "0.18.1"
# gzip: the fetcher asks for compressed answers and unpacks them; the
# manifest's size bound counts the unpacked bytes.
reqwest = { version = "0.13.5", features = ["gzip"] }
# Sign in with Google: checking the RS256 signature of Google's ID tokens.
# A release candidate: 0.10 is the first of sha2's generation, and the
# registry mirror has no final release yet (2026-11-21).
# encoding: reading the private key of the Firebase service account
# (PKCS #8) that signs the OAuth assertion for push to Android phones.
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "std", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tokio-util = "0.7.20"
toml = "1.2.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "smallvec", "std"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
unicode-normalization = "0.1.26"
uniffi = "0.32.2"
# Held at 0.2.129, and js-sys with it: the tool that binds the core for the
# browser, wasm-bindgen-cli, must be of exactly this version, and the
# registry mirror the owner's Mac builds from has no newer one yet. Move
# both on together once it has.
wasm-bindgen = "=0.2.129"
zune-core = "0.5.3"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds and tests keep line numbers for backtraces and nothing
# more: full debug info made every test program of the server some
# 140 MB and filled a 2 TB disk in a night (2026-11-24). Dependencies
# keep none. For a debugger session, set `debug = true` for a while.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The WebAssembly build of the core for the web app: small before fast,
# because every visitor downloads it. apps/web/scripts/build-core.sh uses it.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

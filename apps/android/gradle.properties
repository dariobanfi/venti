# The Kotlin compiler and the dexer need more than Gradle's default.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# The Android ABIs the Rust core is built for: 64-bit phones and the
# emulator. CI passes -Pventi.abis=x86_64 where only the emulator is served.
venti.abis=arm64-v8a,x86_64

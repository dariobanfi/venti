# Every version the Android app builds with, in one place.
#
# Each library's licence was read in its published POM on 2026-11-19. What
# ships inside the app is Apache-2.0 or BSD: AndroidX and Compose (WorkManager among them), Kotlin and
# its libraries, JNA (Apache-2.0 or LGPL; taken under Apache-2.0) and MapLibre
# Native (BSD-2-Clause) with OkHttp, Gson and Timber behind it (Apache-2.0).
# JUnit 4 is EPL-1.0 and Hamcrest BSD-3-Clause; they run the tests and are
# not part of the app.
#
# The home-screen widget (read 2026-11-22 in the POMs): androidx.glance's
# glance-appwidget is Apache-2.0, and so are the AndroidX libraries it
# brings (DataStore among them); the protobuf-javalite it carries inside
# is BSD-3-Clause.
#
# "Continue with Google" (read 2026-11-21 in the POMs): androidx.credentials
# and credentials-play-services-auth are Apache-2.0; Google's googleid and
# the play-services-identity-credentials it pulls in are under the "Android
# Software Development Kit License", not an open-source licence. They are
# the one way Android's Credential Manager reaches Google's sign-in; a build
# without Google's services (F-Droid) would have to leave them out. For the
# owner to decide.
#
# A task as a QR code (read 2026-11-22 in the POMs): com.google.zxing's
# core, which draws the code and reads one, is Apache-2.0 (named in its
# parent POM, zxing-parent) and plain Java, with nothing of Google's
# services; androidx.camera (camera2, lifecycle and view, with the core,
# video and featurecombinationquery they bring), which shows the camera
# and hands its frames to ZXing, is Apache-2.0, and camera-core names a
# BSD licence beside it for what it carries inside. They bring jspecify
# (Apache-2.0) and two of Google's small Java libraries whose POMs in the
# cache name no licence of their own (auto-value-annotations and guava's
# listenablefuture, both published as Apache-2.0: to verify). No ML Kit and
# no Play services: camera-mlkit-vision is not taken.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
core = "1.19.1"
serialization-json = "1.13.0"
maplibre = "13.7.1"
jna = "5.19.1"
work = "2.11.0"
glance = "1.2.0"
credentials = "1.6.0"
googleid = "1.1.1"
zxing = "3.5.3"
camera = "1.5.1"
junit = "4.13.2"
test-core = "1.7.0"
test-runner = "1.7.0"
test-ext-junit = "1.3.0"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

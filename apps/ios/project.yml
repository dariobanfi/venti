# XcodeGen project description. The Xcode project is generated, not committed:
#
#   scripts/build-core.sh && scripts/build-design.sh && xcodegen generate
#
name: Venti
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
packages:
  VentiCore:
    path: Packages/VentiCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
targets:
  Venti:
    type: application
    platform: iOS
    sources:
      - path: Venti
        excludes:
          - "Resources/**"
      - path: Venti/Resources/sample.igc
        buildPhase: resources
      # A folder reference, so the files keep their layout inside the app:
      # the map engine asks for fonts by folder and file name.
      - path: Venti/Resources/MapDemo
        type: folder
        buildPhase: resources
      # The map style shared by all platforms.
      - path: ../../map/style.json
        buildPhase: resources
      # The owner's design language (design/, at the repository's root): its
      # tokens as Swift, compiled into the app as they are; its typeface,
      # with the licence it comes under; and the asset catalogue that
      # scripts/build-design.sh gathers from its app icon, icons, logo and
      # art. Nothing of the pack is copied into this folder and committed.
      - path: ../../design/tokens/VentiTheme.swift
      - path: ../../design/fonts
        includes:
          - "*.ttf"
          - "OFL.txt"
        buildPhase: resources
      - path: Venti/Resources/Design.xcassets
    dependencies:
      - package: VentiCore
        product: VentiCore
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        # The default, fly.venti.app, is set in Config/Base.xcconfig and is to
        # be confirmed once the venti.fly domain is registered.
        PRODUCT_BUNDLE_IDENTIFIER: $(VENTI_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VENTI_PROFILE)
        # Xcode writes the Info.plist from the keys below and merges in this
        # file, which declares the flight-file type the app opens.
        INFOPLIST_FILE: Venti/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Venti
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Venti shows your position on the map and records your flights.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Venti connects to your vario over Bluetooth.
        INFOPLIST_KEY_NSMotionUsageDescription: Venti uses the pressure sensor as a vario when no external one is connected.
        INFOPLIST_KEY_NSCameraUsageDescription: Venti uses the camera to scan the QR code of a task.
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # iPhone in portrait for now: the flight screen is laid out for it.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        # Google's iOS client for "Continue with Google" is in
        # Config/Base.xcconfig (VENTI_GOOGLE_CLIENT_ID), where a build for
        # another Google project overrides it.
      # Venti's address, built into the app (its Info.plist's VentiServer):
      # there is one Venti and the app is its; it is no setting. Debug talks
      # to the owner's own Venti on this Mac, as a simulator reaches it.
      # Release has no public address yet and does not build without one:
      # when there is a domain, it is the value here.
      configs:
        Debug:
          VENTI_SERVER: "http://127.0.0.1:8088"
        Release:
          VENTI_SERVER: ""
    preBuildScripts:
      - name: Venti's address
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${VENTI_SERVER}" ]; then
            echo "error: VENTI_SERVER is empty. The app talks to the Venti it is built with, and this configuration names none: Venti has no public address yet. Set VENTI_SERVER for the configuration in apps/ios/project.yml."
            exit 1
          fi
  VentiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VentiTests
    dependencies:
      - target: Venti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VENTI_BUNDLE_ID).tests
  VentiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VentiUITests
    dependencies:
      - target: Venti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VENTI_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Venti
schemes:
  Venti:
    build:
      targets:
        Venti: all
        VentiTests: [test]
        VentiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VentiTests
        - VentiUITests

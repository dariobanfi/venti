<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  For a Linux machine that takes the screenshots, not for the app.

  The app uses the system's typeface. A bare Linux machine's is DejaVu Sans,
  which is wider than anything a phone or a desktop shows, so text that fits
  everywhere else is cut short in the screenshots. With the Inter fonts
  installed and this file at ~/.config/fontconfig/fonts.conf, the test
  browser draws text in Inter, which is close to the typefaces of Apple,
  Android and Windows. The Web workflow does that.
-->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>

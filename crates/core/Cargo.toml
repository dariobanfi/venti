[package]
name = "venti-core"
description = "The client application core that the iOS, Android and web shells call."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# lib for Rust tests, staticlib for iOS, cdylib for Android and for generating bindings.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Lets the browser's binding (crates/core-wasm) hand the view types to
# JavaScript and generates their TypeScript declarations. Off on the phones.
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
venti-airspace.workspace = true
venti-api-types.workspace = true
venti-domain.workspace = true
venti-flight.workspace = true
venti-llm.workspace = true
venti-sensors.workspace = true
venti-tools.workspace = true
chrono.workspace = true
flate2.workspace = true
image-webp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tsify = { workspace = true, optional = true }
uniffi.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true

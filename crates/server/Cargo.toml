[package]
name = "venti-server"
description = "The Venti server: collects wind, airspace, sites and forecasts from the data sources on a schedule, keeps pilots' accounts, flights, groups, plans and live tracks, hands out offline maps, and serves all of it over a versioned HTTP API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


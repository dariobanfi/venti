# Example configuration of venti-server.
#
# Copy it to a place outside version control (the folder `var/` is ignored
# by git), put in your own values and start the server with
#
#     venti-server serve --config var/venti-server.toml
#
# Every setting can also be given as an environment variable, named beside
# it; a variable wins over this file. The container deployment in `deploy/`
# uses variables only.

# Address the HTTP API listens on.                       VENTI_LISTEN
# Keep it on the loopback address unless a reverse proxy on another machine
# has to reach it.
listen = "127.0.0.1:8080"

# The PostgreSQL database, which must have PostGIS.       VENTI_DATABASE_URL
# This URL holds a password: never commit a file that contains a real one.
database_url = "postgres://venti:change-me@127.0.0.1:5432/venti"

# Region packs to collect and serve.                      VENTI_REGIONS
# Paths are relative to the folder the server is started in. As a variable:
# a comma-separated list.
regions = ["regions/alps-de-at/region.toml"]

# Folder for raw provider payloads, kept so that a      VENTI_ARCHIVE_DIR
# parsing bug can be replayed. Leave it out to keep none.
archive_dir = "var/archive"

# The User-Agent sent to data providers.                  VENTI_USER_AGENT
# Some providers ask operators to name a contact here, for example
# "venti-server/0.1 (+https://your-site.example/contact)". What to put in
# it is the operator's decision; the default names only the program.
user_agent = "venti-server/0.1"

# The Overpass API instance that is asked for the         VENTI_OVERPASS_URL
# flying sites of OpenStreetMap, once a day: the address of its
# interpreter. This is the main public instance, which is also the default.
# Its operator asks for a User-Agent that names the application (above) and
# for few requests; docs/data-sources.md has the terms. Name another
# instance, or your own, if this one refuses the server.
overpass_url = "https://overpass-api.de/api/interpreter"

# The Open-Meteo instance that is asked for forecasts:  VENTI_OPEN_METEO_URL
# one that you run yourself, by its address. There is no default. Without
# it the server runs and has no forecasts, which /v1/health and
# /v1/forecast say; it never asks Open-Meteo's public service. The instance
# must have API_SYNC_APIKEYS set, or it does not tell which model runs it
# holds. deploy/README.md says how to run one beside the server.
# open_meteo_url = "http://open-meteo:8080"

# Web origins that may call the API from a browser.      VENTI_CORS_ORIGINS
# List the origin of the web app. An empty list allows none; apps that are
# not browsers are never restricted. As a variable: a comma-separated list.
cors_origins = ["http://localhost:5173"]

# One of error, warn, info, debug, trace.                 VENTI_LOG_LEVEL
log_level = "info"

# Who may create an account.                              VENTI_REGISTRATION
#   "invite"  whoever has an invite code (the default). Make codes with
#             venti-server invite --config <this file>
#   "open"    anyone
#   "closed"  nobody; existing accounts keep working
registration = "invite"

# The address people reach the server at, without a      VENTI_PUBLIC_URL
# slash at the end. Share pages need it: the links a chat app follows to
# build a preview must be complete. Left out, links point at the listen
# address, which only works on this machine.
public_url = "http://127.0.0.1:8080"

# Reverse proxies in front of the server, as addresses   VENTI_TRUSTED_PROXIES
# or networks ("172.18.0.2", "10.0.0.0/8"). Sign-in attempts are counted
# per client address. Behind a proxy every connection comes from the proxy,
# and the client's address is in the X-Forwarded-For header, which anyone
# can write. It is believed only from the proxies listed here. Empty when
# clients connect directly. As a variable: a comma-separated list.
trusted_proxies = []

[accounts]
# The most flights one account may keep.                  VENTI_ACCOUNT_FLIGHTS
# Twenty years of flying a great deal stay well below this; it is here so
# that one account cannot fill the disk.
flights = 25000

# The most megabytes of flight files one account may     VENTI_ACCOUNT_STORAGE_MB
# keep, counted as the files were uploaded. The database stores them
# compressed, in about a third of that.
storage_mb = 4096

[retention]
# Observations are kept for this many whole calendar     VENTI_OBSERVATION_MONTHS
# months before the current one. Older months are dropped.
observation_months = 13

# Raw provider payloads are kept for this many days.      VENTI_ARCHIVE_DAYS
archive_days = 14

# A live track is kept for this many hours after its      VENTI_LIVE_HOURS
# newest position and then removed, with its positions. Answers of the API
# say when (`expires_at`), and the page a link opens names this number.
live_hours = 48

# A report that a pilot sent is kept for this many days   VENTI_REPORT_DAYS
# after it was closed with `venti-server close-report`, and then removed.
# A report that is still open is kept until it is closed.
report_days = 90

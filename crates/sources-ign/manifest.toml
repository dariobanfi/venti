link = "https://cartes.gouv.fr/rechercher-une-donnee/dataset/IGNF_ADMIN-EXPRESS"
constraints = [
    "The licence, by the data set's own record (IGNF_ADMIN-EXPRESS, revised 2026-11-19): \"Licence Ouverte / Open License (compatible ODC-BY, CC-BY 2.0)\", access \"Pas de restriction d'accès public\".",
    "To verify: IGN's own wording of a credit; the credit above is ours.",

id = "meteotrentino"
# The Autonomous Province of Trento publishes the data on its open-data
# portal; its weather service, Meteotrentino, runs the stations and the
# service that answers (dati.meteotrentino.it).
#
# IN THE BUILD AND IN NO REGION PACK since 2026-11-22: the server cannot
# reach the host. Its first live run failed with "error sending request",
# beneath which is "Connection reset by peer", at the first message of TLS.
# What the host offers, by `openssl s_client` on 2026-11-22:
#   - Microsoft-IIS/8.5 at 46.226.204.20; the names content, contenuti,
#     realtime, neve and husky.meteotrentino.it are the same machine;
#   - a certificate of Let's Encrypt for an RSA key, valid, its chain whole,
#     the host's name in it: nothing is wrong with the certificate;
#   - TLS 1.0, 1.1 and 1.2; no TLS 1.3;
#   - for TLS 1.2, ECDHE only with CBC suites (ECDHE-RSA-AES256-SHA384,
#     ECDHE-RSA-AES128-SHA256, and the SHA-1 ones), and AES-GCM only with a
#     static RSA key exchange (AES256-GCM-SHA384) or with DHE and a key that
#     OpenSSL refuses as too small. Offered ECDHE-RSA with AES-GCM or
#     ChaCha20-Poly1305 alone, or TLS 1.3 alone, it resets the connection.
# The server's TLS is rustls, which has TLS 1.3 and, for TLS 1.2, ECDHE with
# AES-GCM or ChaCha20-Poly1305, and by its design neither CBC suites nor a
# key exchange without forward secrecy. So the two share nothing, and that
# is the host's to mend: the fetcher is not weakened for one provider, and
# OpenSSL is banned from the workspace (deny.toml). `curl` on a Mac reaches
# the host because it still offers the CBC suites.
# The province's open-data pages name this host and no other for both
# datasets (their resources are written with http://, which the fetcher
# does not ask), read on 2026-11-22 through the catalogue's own API,
# https://dati.trentino.it/api/3/action/package_show?id=dati-recenti-delle-stazioni-meteo.
# WHAT BRINGS IT BACK: the host offering TLS 1.3, or TLS 1.2 with
# ECDHE-RSA-AES256-GCM-SHA384 or ECDHE-RSA-AES128-GCM-SHA256, or the
# province serving the same answers from another host. (IIS 8.5 is the web
# server of Windows Server 2012 R2, whose TLS has those two suites only for
# ECDSA certificates, and Windows Server 2016 has them for RSA ones: said
# from memory, not read on Microsoft's pages today, so to verify. Still so on
# 2026-11-23: no page this manifest names says it, and Microsoft's were not
# read.) Test with
#   openssl s_client -connect dati.meteotrentino.it:443 -tls1_2 \
#     -cipher ECDHE-RSA-AES256-GCM-SHA384
# and then one live run of the source; then its name goes back into
# regions/alps-south and regions/alps-de-at, after South Tyrol's.
provider = "Provincia Autonoma di Trento - Meteotrentino"
# The name pilots know the network by, for a station's row in a list.
short_name = "Meteotrentino"
kinds = ["observations"]
countries = ["IT"]
# A station's answer has a value every quarter of an hour. On 2026-11-22 at
# 08:22 UTC the newest was of 08:00 UTC: 22 minutes old.
cadence_seconds = 900
auth = "none"
# A station's answer holds the values since midnight at the start of the
# day before, so it grows through the day: 58 to 90 kB for a wind station
# at 08:22 UTC on 2026-11-22, some 130 kB before midnight. The station list
# was 73,687 bytes. Sent with gzip when asked, an answer of 89 kB was 7 kB.
max_response_kb = 512

# The province publishes no limit on requests. These are Venti's own: a
# run is the list and one request for each wind station in the area, 47 for
# the whole province, four runs an hour; the hourly figure leaves room for
# stations put into service later, and two at a time keeps a small server
# unhurried.
[rate_limit]
per_second = 2
per_hour = 240

[licence]
name = "CC BY 4.0"
commercial = true
redistribution = true
share_alike = false
# The dataset's page names the licence, "Licenza Creative Commons
# Attribution 4.0", and the author, Meteotrentino, for the Provincia
# Autonoma di Trento; it gives no wording for the credit. This line is
# Venti's, naming both as the page does: to verify with the province.
# Read again on 2026-11-23: both datasets' pages still give no wording for
# the credit; their records name as author and publisher the "Servizio
# Prevenzione Rischi" and as holder the Provincia Autonoma di Trento. That
# the line suits the province is the province's to say, not a page's: still
# to verify with it.
attribution = "Dati: Provincia Autonoma di Trento - Meteotrentino, CC BY 4.0"
link = "https://dati.trentino.it/dataset/dati-recenti-delle-stazioni-meteo"
constraints = [
    "The dataset's page: the values come from a network of automatic stations in real time, \"non hanno subito alcun processo di validazione e possono pertanto contenere errori\" (have not been validated and may hold errors).",
    "The station list is a dataset of its own, \"Anagrafica stazioni meteo (stazioni automatiche)\", under the same licence: https://dati.trentino.it/dataset/anagrafica-stazioni-meteo-stazioni-automatiche.",
    "The service has a lighter answer for one station, datiRealtimeUnaStazione (JSON, any number of hours, 5 kB for one hour), which names no licence of its own and is in no dataset of the portal: not used until the province says it is under the same licence (to verify). On 2026-11-23 the dataset's page listed 36 resources, each an answer of ultimiDatiStazione for one station (the service the adapter asks), and datiRealtimeUnaStazione still among none of them.",
]
verified_on = "2026-11-22"
verified_from = [
    "https://dati.trentino.it/dataset/dati-recenti-delle-stazioni-meteo",
    "https://dati.trentino.it/dataset/anagrafica-stazioni-meteo-stazioni-automatiche",
    "https://contenuti.meteotrentino.it/doc/info_ultimi_dati_e_dati_storici.pdf",
]

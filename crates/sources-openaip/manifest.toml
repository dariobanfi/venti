id = "openaip"
provider = "openAIP"
kinds = ["airspace"]
# The countries whose export files are fetched: every country the box of
# the three Alpine regions takes in, 5.0° to 17.2° E and 43.5° to 48.5° N
# (regions/), and no other. openAIP covers the world; adding a country is
# adding its code here and recording a fixture for it. Liechtenstein, Monaco
# and San Marino lie in the box and have no file of their own at openAIP
# (asked for on 2026-11-19 and 2026-11-22: not found); their airspace is in
# the files of Switzerland, France and Italy. Czechia ends north of the box.
countries = ["DE", "AT", "CH", "FR", "IT", "SI", "HR", "BA", "HU", "SK"]
# The export files are rebuilt every day.
cadence_seconds = 86400
# The export files are public. Only openAIP's API needs a key, and it is not used.
auth = "none"
# The largest country files, France's and Italy's, were 3.9 and 3.6 MB on
# 2026-11-22. A run in which one file is refused leaves the airspace a
# day older, so the room is wide.
max_response_kb = 32768

[licence]
name = "CC BY-NC 4.0"
commercial = false
redistribution = true
# CC BY-NC 4.0 itself has no share-alike term. openAIP's own terms of use
# add one (see the second constraint), so the stricter reading is declared.
share_alike = true
attribution = "Data used comes from openAIP and is licensed under the Creative Commons Attribution-NonCommercial 4.0 International License. Visit https://www.openaip.net and contribute to better aviation data, free for everyone to use and share."
link = "https://www.openaip.net"
# openAIP's own words, from its legal page. They go out with the data, and
# whatever shows the data shows them.
notice = "OpenAIP data is not certified and must not be used for primary navigation or flight planning. Never rely on openAIP data! OpenAIP data contains errors."
constraints = [
    "It must be clearly visible to every user that the data is openAIP's or based on it.",
    "openAIP's terms of use say that data altered or built upon may be distributed only under the same or a similar licence.",
    "The data must not be sold on its own, for example as a paid data update. It may ship with a paid app as long as the data stays free.",
    "The data is not certified. Wherever the app shows it, the app shows the notice above.",
]
verified_on = "2026-11-19"
verified_from = [
    "https://www.openaip.net/",
    "https://www.openaip.net/legal",
    "https://www.openaip.net/docs",
]

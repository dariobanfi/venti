[package]
name = "venti-sources"
description = "The framework every external data source plugs into: manifest, adapter traits, pipeline, registry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
venti-domain.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
# Providers publish coordinates with sixteen and seventeen digits. Without
# this feature the JSON parser may read such a number one step off in its
# last digit; with it every number is read as published. The feature is set
# here, where every adapter gets it, so that an adapter reads the same
# whichever crates are built beside it.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true

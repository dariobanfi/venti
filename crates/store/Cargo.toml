[package]
name = "venti-store"
description = "Server persistence: what the data sources deliver, and pilots' accounts, sessions and flights, in PostgreSQL with PostGIS or in memory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
venti-domain.workspace = true
chrono.workspace = true
deadpool-postgres.workspace = true
# Airspace records are kept as the JSON the API sends. Every number of a
# record must come back from the database as it went in, which the parser
# only promises with this feature.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres.workspace = true

[lints]
workspace = true

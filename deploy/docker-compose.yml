# Venti on one Linux server.
#
#   caddy   TLS, the web app's static files, map tiles, and the way in to the API
#   server  venti-server: collects the data sources, keeps accounts and
#           flights, serves /v1 and the share pages under /f
#   db      PostgreSQL with PostGIS, the only database
#
# Only caddy is reachable from outside. Settings and the database password
# come from the file `.env` beside this one; copy `env.example` to make it.
# The runbook is README.md in this folder.

name: venti

# What every service does with its log: Docker keeps five files of ten
# megabytes each and drops the oldest. Without this Docker keeps every line
# for ever, and a client that makes a service talk fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# What every service is held to, whatever it was broken into with: none of
# the powers of the machine's root user beyond those it is given back by
# name below, and no way to gain any by running a program that carries
# them.
x-confined: &confined
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    <<: *confined
    # Caddy listens on ports 80 and 443, which takes this one power.
    cap_add: [NET_BIND_SERVICE]
    # It writes certificates to /data and its settings to /config, which
    # are volumes, and nowhere else.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: ${VENTI_CADDY_MEMORY:-256m}
    pids_limit: 256
    depends_on:
      - server
    # Published on the machine's IPv4 addresses and on no other. Without
    # the "0.0.0.0" Docker also listens on IPv6 and hands such connections
    # to this IPv4-only network through its own forwarder (its
    # documentation, read 2026-11-19), and Caddy would then see one and
    # the same private address for every IPv6 visitor: the server would
    # count them all as one. README.md, "The visitor's address", says
    # what serving IPv6 properly needs.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp" # HTTP/3
    environment:
      VENTI_SITE_ADDRESS: ${VENTI_SITE_ADDRESS:?set VENTI_SITE_ADDRESS in .env}
    # A fixed address, so that the server can be told exactly whose word on
    # a client's address to believe.
    networks:
      default:
        ipv4_address: ${VENTI_NETWORK:-172.30.250}.2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys. Losing this volume means asking for new
      # certificates, which the issuers rate-limit.
      - caddy-data:/data
      - caddy-config:/config
      # Static files, kept on the host so that a build job or rsync can
      # replace them: the web app, and map tiles as PMTiles archives.
      - ${VENTI_WEB_DIR:-./data/web}:/srv/web:ro
      - ${VENTI_TILES_DIR:-./data/tiles}:/srv/tiles:ro

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: venti-server:local
    restart: unless-stopped
    logging: *logging
    <<: *confined
    # The server runs as a user of its own (the Dockerfile's) and writes
    # the archive of raw payloads, a volume, and nothing else.
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    # What it holds at most is a few hundred megabytes: eight flight files
    # at a time, four password hashes of 19 MB, its tables of attempts.
    mem_limit: ${VENTI_SERVER_MEMORY:-1g}
    # Threads count too: it starts up to 512 for work that may block, and a
    # program of its own for every flight file it analyses.
    pids_limit: 1024
    depends_on:
      db:
        condition: service_healthy
    environment:
      VENTI_DATABASE_URL: postgres://venti:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/venti
      VENTI_USER_AGENT: ${VENTI_USER_AGENT:-}
      VENTI_OVERPASS_URL: ${VENTI_OVERPASS_URL:-}
      VENTI_OPEN_METEO_URL: ${VENTI_OPEN_METEO_URL:-}
      VENTI_CORS_ORIGINS: ${VENTI_CORS_ORIGINS:-}
      VENTI_LOG_LEVEL: ${VENTI_LOG_LEVEL:-}
      VENTI_OBSERVATION_MONTHS: ${VENTI_OBSERVATION_MONTHS:-}
      VENTI_ARCHIVE_DAYS: ${VENTI_ARCHIVE_DAYS:-}
      VENTI_LIVE_HOURS: ${VENTI_LIVE_HOURS:-}
      VENTI_REGISTRATION: ${VENTI_REGISTRATION:-}
      VENTI_ACCOUNT_FLIGHTS: ${VENTI_ACCOUNT_FLIGHTS:-}
      VENTI_ACCOUNT_STORAGE_MB: ${VENTI_ACCOUNT_STORAGE_MB:-}
      VENTI_PUBLIC_URL: ${VENTI_PUBLIC_URL:-}
      # Every request reaches the server through Caddy, so every connection
      # comes from Caddy's address. Only from there is X-Forwarded-For
      # believed; see the Caddyfile.
      VENTI_TRUSTED_PROXIES: ${VENTI_NETWORK:-172.30.250}.2
    volumes:
      - archive:/var/lib/venti/archive
    # A run in flight is dropped on shutdown and repeated after the restart,
    # so the default ten seconds are enough.
    stop_grace_period: 10s

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    <<: *confined
    # The image starts as root, hands the data folder to the user
    # "postgres" and becomes that user: these five powers are what that
    # takes.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: ${VENTI_DB_MEMORY:-2g}
    pids_limit: 512
    environment:
      # The database's superuser, "postgres", is for whoever keeps the
      # machine: it is reached from inside this container only (docker
      # compose exec db psql --username postgres), and db-init.sh takes its
      # password away so that nothing can sign in as it over the network.
      # The server signs in as "venti", which db-init.sh makes: it owns the
      # database and is no superuser. POSTGRES_PASSWORD becomes its
      # password.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: venti
    volumes:
      - db-data:/var/lib/postgresql/data
      # Run once, when the database is first created on an empty volume,
      # after the image's own script has put PostGIS into the database.
      - ./db-init.sh:/docker-entrypoint-initdb.d/20-venti-role.sh:ro
    # PostgreSQL uses shared memory for parallel queries; Docker's default
    # of 64 MB is too little for anything but small tables.
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username venti --dbname venti"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  # Optional: an Open-Meteo instance of your own, for forecasts. It is not
  # started unless asked for,
  #   docker compose --profile forecasts up -d
  # and the server uses it once .env says
  #   VENTI_OPEN_METEO_URL=http://open-meteo:8080
  # It reads Open-Meteo's open data on AWS when a place is asked for and
  # keeps what it read in a cache on disk. It publishes no port: only the
  # server reaches it. README.md says what it needs and what is still to
  # verify.
  open-meteo:
    image: ghcr.io/open-meteo/open-meteo:latest
    profiles: ["forecasts"]
    restart: unless-stopped
    logging: *logging
    environment:
      REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/
      CACHE_SIZE: ${OPEN_METEO_CACHE_SIZE:-8GB}
      # Without a key for syncing set, an instance does not tell which run
      # of a model it holds, and the server then serves no forecast. The
      # key guards nothing here: the instance is reachable only from
      # inside this network, and the data behind it is public.
      API_SYNC_APIKEYS: ${OPEN_METEO_SYNC_KEY:-venti}
    volumes:
      - open-meteo-data:/app/data

# The services' own network. Caddy has the address that ends in .2 and
# keeps it; the other two get theirs from the upper half of the range, so
# that none of them can be handed Caddy's.
networks:
  default:
    ipam:
      config:
        - subnet: ${VENTI_NETWORK:-172.30.250}.0/24
          ip_range: ${VENTI_NETWORK:-172.30.250}.128/25

volumes:
  db-data:
  open-meteo-data:
  archive:
  caddy-data:
  caddy-config:

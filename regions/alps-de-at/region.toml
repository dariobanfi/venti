# Germany and Austria: the first region.
#
# The box covers Austria, the Bavarian Alps and their foothills up to Munich.
# It is the area in which live data is collected, not a limit on where the app
# can be used.

id = "alps-de-at"
name = "Germany and Austria"
languages = ["de", "en"]

[bounds]
south = 46.3
west = 9.4
north = 48.5
east = 17.2

# Stations of wind and weather. The box's south takes in South Tyrol down to
# 46.3° N, which is all of the province's weather stations but Salurn. The
# airfield reports come last in the priority: where a weather service has a
# station of its own on an airfield, that station is the better one, and the
# server hands it out alone (docs/data-sources.md, "The same station from two
# sources").
[observations]
sources = ["dwd-10min", "geosphere-tawes", "suedtirol-meteo", "awc-metar"]
priority = ["dwd-10min", "geosphere-tawes", "suedtirol-meteo", "awc-metar"]

# Airspace from openAIP, which may not be used commercially and stays a
# layer of its own. Its adapter fetches every country the box above takes in:
# Germany, Austria, Switzerland, Italy, Slovenia, Croatia, Hungary and
# Slovakia. Liechtenstein lies in the box too and has no file of its own at
# openAIP.
[airspace]
sources = ["openaip"]

# Take-offs and landings from OpenStreetMap, under the ODbL: a layer of its
# own. OpenStreetMap has what somebody entered, which in this region is a
# fraction of the sites there are; docs/data-sources.md has the count.
[sites]
sources = ["osm-free-flying"]

# Point forecasts, from an Open-Meteo instance that whoever runs the server
# runs themself. A server that is not told where it is (open_meteo_url) has
# no forecasts and says so.
[forecasts]
sources = ["open-meteo"]

# Rain radar: DWD's composite of the German radars, a frame every five
# minutes. It sees Bavaria and the north of Tirol and Vorarlberg, and
# nothing east of Passau or south of the main ridge: a layer of its own,
# which says where it does not see.
[radar]
sources = ["dwd-radar-ry"]

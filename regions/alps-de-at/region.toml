# Germany and Austria: the first region.
#
# The box covers Austria, the Bavarian Alps and their foothills up to Munich.
# It is the area in which live data is collected, not a limit on where the app
# can be used.

id = "alps-de-at"
name = "Germany and Austria"
languages = ["de", "en"]

[bounds]
south = 46.3
west = 9.4
north = 48.5
east = 17.2

# Stations of wind and weather. The box's south takes in South Tyrol down to
# 46.3° N, which is all of the province's weather stations but Salurn, and
# its west the east of Switzerland and Liechtenstein: 24 stations of
# MeteoSwiss and 44 of the SLF's avalanche service on 2026-11-22. It also
# takes in the north of Slovenia (the Julian Alps, the Karawanks, the
# Pohorje), so ARSO's stations are named here and in regions/alps-south,
# and collected once over both boxes. It takes in the north of Trentino
# too (the valleys of Sole, Non, Fassa and Primiero), whose network
# (`meteotrentino`) is in the build and in no pack since 2026-11-22: the
# server cannot reach the province's host (regions/alps-south says why).
#
# The priority says which station is handed out where two networks measure
# at one place (docs/data-sources.md, "The same station from two sources"):
# the weather services first, then the SLF's stations, then the pilots' own
# sensors of Pioupiou, which have no height and so are never taken for
# another network's station. The airfield reports come last: where a weather
# service has a station of its own on an airfield, that station is the
# better one, and the server hands it out alone.
#
# A source is switched off by taking its name out of both lists; nothing
# else changes. Pioupiou's licence holds only while every other station
# source of the server is open for commercial reuse: read
# docs/data-sources.md, "Pioupiou's condition", before adding one here.
[observations]
sources = [
    "dwd-10min",
    "geosphere-tawes",
    "suedtirol-meteo",
    "meteoswiss-smn",
    "arso-ams",
    "slf-imis",
    "pioupiou",
    "awc-metar",
]
priority = [
    "dwd-10min",
    "geosphere-tawes",
    "suedtirol-meteo",
    "meteoswiss-smn",
    "arso-ams",
    "slf-imis",
    "pioupiou",
    "awc-metar",
]

# Airspace from openAIP, which may not be used commercially and stays a
# layer of its own. Its adapter fetches every country the box of the three
# Alpine regions takes in: Germany, Austria, Switzerland, France, Italy,
# Slovenia, Croatia, Bosnia and Herzegovina, Hungary and Slovakia. Of these
# the box above takes in all but France and Bosnia and Herzegovina, and a
# server that collects this region alone fetches them all the same.
# Liechtenstein lies in the box too and has no file of its own at openAIP:
# its airspace is in Switzerland's.
[airspace]
sources = ["openaip"]

# Take-offs and landings from OpenStreetMap, under the ODbL: a layer of its
# own. OpenStreetMap has what somebody entered, which in this region is a
# fraction of the sites there are; docs/data-sources.md has the count.
[sites]
sources = ["osm-free-flying"]

# Power lines and ropeways from OpenStreetMap, under the ODbL: a layer of its
# own, apart from the sites. Incomplete: docs/data-sources.md says what lacks.
# The answer for the region is far larger than the main public Overpass
# instance asks for in a day: collect it from an instance of your own.
[cables]
sources = ["osm-cables"]

# Point forecasts, from an Open-Meteo instance that whoever runs the server
# runs themself. A server that is not told where it is (open_meteo_url) has
# no forecasts and says so.
[forecasts]
sources = ["open-meteo"]

# Rain radar, in two layers that are never merged. DWD's composite of the
# German radars, a frame every five minutes: it sees Bavaria and the north
# of Tirol and Vorarlberg, and nothing east of Passau or south of the main
# ridge, and says where it does not see. And the first step of GeoSphere
# Austria's nowcast INCA, every quarter of an hour, some 22 minutes after
# the quarter it is of: rain as a model puts it together from radars and
# gauges, with a value everywhere in the region.
[radar]
sources = ["dwd-radar-ry", "geosphere-inca-rr"]

# Aircraft that the Open Glider Network hears: FLARM, FANET, OGN trackers
# and others, over a connection that stays open, under the ODbL and the
# network's two rules (docs/data-sources.md). A layer of its own, never one
# record with Venti's own live tracks.
[live]
sources = ["ogn"]

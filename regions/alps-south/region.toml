# The southern Alps: the third region.
#
# The box lies south of the first region's (regions/alps-de-at) and shares
# its edge at 46.3° N: the Bergamo Alps and Lake Garda, Trentino, the
# south of the Dolomites, Veneto, Friuli and Slovenia south of the Karawanks,
# with the plain of the Po, the north of the Apennines and the north of
# Croatia south of them. With regions/alps-west it makes the three boxes
# that tile the whole Alps, 5.0° to 17.2° E and 43.5° to 48.5° N. A source
# that all three name is collected once, over that whole box
# (docs/architecture.md, "The whole Alps").
#
# Listed here is what the adapters that exist can collect in this box as
# they are, by the measurements of 2026-11-22. What is not listed, and what
# has to be built before it can be, is in docs/architecture.md.

id = "alps-south"
name = "Southern Alps"
languages = ["it", "sl", "de", "en"]

[bounds]
south = 43.5
west = 9.4
north = 46.3
east = 17.2

# Stations of wind and weather. South Tyrol's network has one station south
# of the first region's box, Salurn at 46.24° N, and the SLF one; the
# pilots' own sensors of Pioupiou are few here; the airfields' reports are
# 24, the wind at an airfield and not at a take-off. The order of the
# priority is the first region's, and so is Pioupiou's condition.
# ARSO's stations of Slovenia (some hundred) are collected since
# 2026-11-22; they reach into the first region's box and are named there
# too. Two adapters are in the build and named in no pack. Trentino's
# (`meteotrentino`, 46 stations with an anemometer) was named here and in
# the first region's pack for a morning and taken out on 2026-11-22: the
# province's host, dati.meteotrentino.it, encrypts with nothing the
# server's TLS accepts, so the server cannot reach it at all
# (docs/data-sources.md, the row "Meteotrentino", says what the host offers
# and what brings the source back). Lombardy's (`arpa-lombardia`): its
# values reach the region's portal two to six hours late, which is no live
# wind. The weather
# services of Veneto and Friuli have no adapter yet: docs/data-sources.md,
# "Catalogue: the rest of the Alps", lists them in the order to write them.
[observations]
sources = [
    "suedtirol-meteo",
    "arso-ams",
    "slf-imis",
    "pioupiou",
    "awc-metar",
]
priority = [
    "suedtirol-meteo",
    "arso-ams",
    "slf-imis",
    "pioupiou",
    "awc-metar",
]

# Airspace from openAIP, which may not be used commercially and stays a
# layer of its own. The three packs name it, so it is collected once over
# the box of all three, and its adapter fetches every country that box
# takes in: Germany, Austria, Switzerland, France, Italy, Slovenia, Croatia,
# Bosnia and Herzegovina, Hungary and Slovakia. This box takes in Italy,
# Switzerland (the Val Poschiavo), Slovenia, Croatia, Bosnia and
# Herzegovina, Hungary and San Marino, whose airspace is in Italy's file.
[airspace]
sources = ["openaip"]

# Take-offs and landings from OpenStreetMap, under the ODbL: a layer of its
# own. 192 sites in this box on 2026-11-22.
[sites]
sources = ["osm-free-flying"]

# No [cables], no [forecasts] and no [radar] yet, for the reasons
# regions/alps-west/region.toml gives.

# Aircraft that the Open Glider Network hears, as in the first region.
[live]
sources = ["ogn"]
